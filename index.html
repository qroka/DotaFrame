<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DotaFrame</title>
</head>

<body>
    <main class="flex gap-12 min-h-screen bg-zinc-950 p-8">
        <div class="flex flex-col gap-4">
                <h1 class="text-2xl font-bold text-white">
                    DotaFrame
                </h1>
                <div class="flex flex-col gap-2">
                    <label for="input-team-a" class="block text-white">
                        Название первой команды
                    </label>
                    <input id="input-team-a" type="text" placeholder="Введите название команды"
                        class="bg-slate-700 text-white p-3 w-60">
                </div>
                <div class="flex flex-col gap-2">
                    <label for="input-team-b" class="block text-white">
                        Название второй команды
                    </label>
                    <input id="input-team-b" type="text" placeholder="Введите название команды"
                        class="bg-slate-700 text-white p-3 w-60">
                </div>
                <div class="flex flex-col gap-2">
                    <label for="input-tournament" class="block text-white">
                        Название турнира
                    </label>
                    <input id="input-tournament" type="text" placeholder="Введите название турнира"
                        class="bg-slate-700 text-white p-3 w-60">
                </div>
                <div class="flex flex-col gap-2">
                    <label for="input-format" class="block text-white">
                        Формат матча
                    </label>
                    <select id="input-format" class="bg-slate-700 text-white p-3 w-60">
                        <option value="BO1">BO1</option>
                        <option value="BO2">BO2</option>
                        <option value="BO3" selected>BO3</option>
                        <option value="BO5">BO5</option>
                    </select>
                </div>
                <div class="flex flex-col gap-2">
                    <label for="input-time" class="block text-white">
                        Время начала матча
                    </label>
                    <input id="input-time" type="time" value="18:00" class="bg-slate-700 text-white p-3 w-60">
                </div>
                <div class="flex flex-col gap-2">
                    <label for="input-logo-team-a" class="block text-white">
                        Логотип первой команды
                    </label>
                    <input id="input-logo-team-a" type="file" accept="image/png" class="bg-slate-700 text-white p-3 w-60">
                </div>
                <button id="remove-logo-a" type="button"
                    class="bg-red-600 hover:bg-red-800 text-white p-3 w-60 cursor-pointer hidden">
                    Удалить логотип первой команды
                </button>
                <div class="flex flex-col gap-2">
                    <label for="input-logo-team-b" class="block text-white">
                        Логотип второй команды
                    </label>
                    <input id="input-logo-team-b" type="file" accept="image/png" class="bg-slate-700 text-white p-3 w-60">
                </div>
                <button id="remove-logo-b" type="button"
                    class="bg-red-600 hover:bg-red-800 text-white p-3 w-60 cursor-pointer hidden">
                    Удалить логотип второй команды
                </button>
                <button id="download-png" type="button"
                    class="bg-blue-600 hover:bg-blue-800 text-white p-3 w-60 cursor-pointer">
                    Экспортировать в PNG
                </button>
            </div>



        <div class="w-160 h-160 overflow-hidden shrink-0">

            <!-- ШАБЛОН -->
            <!-- ШАБЛОН -->

                    <div class="flex flex-col items-start gap-6 uppercase italic">
                        <p id="title" class="text-[200px] text-trim roboto-flex-bold">MATCH</p>
                        <p id="enemy-team" class="text-[64px] text-trim roboto-flex-regular">VS Natus Vincere </p>
                    </div>
                    <div class="flex flex-col items-start gap-6 lowercase italic">
                        <p id="telegram-url" class="text-[32px] text-trim roboto-flex-regular">t.me/vanishoid</p>
                        <p id="twitch-url" class="text-[32px] text-trim roboto-flex-regular">t.tv/vanilll1</p>

                    </div>
                </div>

                <footer class="flex justify-between items-end w-full text-[30px]">
                    <div class="flex flex-col items-start gap-6 lowercase italic">
                        <p id="format" class="text-[32px] text-trim roboto-flex-medium uppercase">BEST OF 3</p>
                        <p id="tournament" class="text-[32px] text-trim roboto-flex-medium uppercase">EPL MASTERS 3</p>

                    <p id="tournament" class="text-[24px] text-trim roboto-flex-regular uppercase">@SOKRALDESIGN</p>
